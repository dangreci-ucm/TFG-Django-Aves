<!DOCTYPE html>
<html lang="es">
<head>
  <link rel="stylesheet" type="text/css" media="screen" href="/css/same.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <link rel="icon" type="image/png" href="/img/favicon_ave.png">
  <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">
  <meta name="viewport" content="width=device-width">
  <meta charset="UTF-8">

  <title>Historial de predicciones - TFG</title>

  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
  <script defer src="/js/nav.js"></script>
</head>

<body>
  <header>
    <h1>Identificación de Restos Óseos en Rapaces Emblemáticas</h1>
  </header>

  <div id="site-navbar-placeholder"></div>

  <div class="text">
    <div class="description">
      <h1>Historial de predicciones</h1>
      <p>En esta página puedes consultar tus predicciones anteriores.</p>

      <div id="authWarning" style="display:none;">
        <p>No has iniciado sesión. Te redirigimos a login…</p>
      </div>

      <div id="historyFilters" style="margin-bottom: 2em; padding: 1em; background-color: rgba(29,71,121,.04);">
        <p><strong>Filtros</strong></p>

        <div id="adminHistoryScopeWrapper" style="display:none; padding: 1em 0;">
          <label for="historyScopeSelect"><strong>Predicciones:</strong></label><br>
          <select id="historyScopeSelect" style="padding: 0.4em; margin-top: 0.5em;">
            <option value="mine">Mis predicciones</option>
            <option value="all">Todas</option>
          </select>
        </div>

        <div style="padding: 1em 0;">
          <label for="searchInput"><strong>Búsqueda:</strong></label><br>
          <input
            type="text"
            id="searchInput"
            placeholder="Buscar por usuario, modelo, especie o dato de entrada"
            style="width: 100%; max-width: 500px; padding: 0.4em; margin-top: 0.5em;"
          >
        </div>

        <div style="padding: 1em 0;">
          <label for="dateFrom"><strong>Desde:</strong></label><br>
          <input type="date" id="dateFrom" style="padding: 0.4em; margin-top: 0.5em;">

          <br><br>

          <label for="dateTo"><strong>Hasta:</strong></label><br>
          <input type="date" id="dateTo" style="padding: 0.4em; margin-top: 0.5em;">
        </div>

        <div style="padding: 1em 0;">
          <label for="sortOrder"><strong>Orden:</strong></label><br>
          <select id="sortOrder" style="padding: 0.4em; margin-top: 0.5em;">
            <option value="desc">Más recientes primero</option>
            <option value="asc">Más antiguas primero</option>
          </select>
        </div>

        <div style="padding: 1em 0;">
          <button id="clearFilters" type="button">Limpiar filtros</button>
          <button id="downloadXlsx" type="button">Descargar Excel</button>
        </div>
      </div>

      <div id="historySummary"></div>

      <div id="historyContainer">
        <p>Cargando historial...</p>
      </div>
    </div>
  </div>

  <script>
    let allLogs = [];
    let currentFilteredLogs = [];
    let currentUser = null;
    let adminUsersLoaded = false;

    function getCookie(name) {
      let cookieValue = null;

      if (document.cookie && document.cookie !== "") {
        const cookies = document.cookie.split(";");

        for (let cookie of cookies) {
          cookie = cookie.trim();

          if (cookie.startsWith(name + "=")) {
            cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
            break;
          }
        }
      }

      return cookieValue;
    }

    async function deletePrediction(predictionId) {
      const confirmed = window.confirm("¿Seguro que quieres borrar esta predicción?");
      if (!confirmed) return;

      try {
        const res = await fetch(`/api/predictions/${predictionId}/delete`, {
          method: "DELETE",
          credentials: "include",
          headers: {
            "X-CSRFToken": getCookie("csrftoken"),
            "Accept": "application/json"
          }
        });

        const data = await res.json();

        if (!res.ok || !data.ok) {
          alert(data.error || "No se pudo borrar la predicción.");
          return;
        }

        allLogs = allLogs.filter(log => log.id !== predictionId);
        applyFilters();

      } catch (err) {
        alert("Error de conexión al borrar la predicción.");
      }
    }

    async function checkAuthOrRedirect() {
      const res = await fetch("/api/me", {
        credentials: "include",
        cache: "no-store"
      });

      const data = await res.json();

      if (!data.authenticated) {
        document.getElementById("authWarning").style.display = "block";
        const next = encodeURIComponent("/historial.html");
        window.location.href = `/accounts/login/?next=${next}`;
        return false;
      }

      currentUser = data;
      return true;
    }

    async function setupAdminHistorySelector() {
      if (!currentUser || !currentUser.is_staff) return;

      const wrapper = document.getElementById("adminHistoryScopeWrapper");
      const select = document.getElementById("historyScopeSelect");

      if (!wrapper || !select) return;

      wrapper.style.display = "block";

      if (adminUsersLoaded) return;

      try {
        const res = await fetch("/api/users", {
          method: "GET",
          credentials: "include",
          cache: "no-store",
          headers: {
            "Accept": "application/json"
          }
        });

        const data = await res.json();

        if (!res.ok || !data.ok || !Array.isArray(data.items)) {
          console.warn("No se pudieron cargar los usuarios.");
          return;
        }

        data.items.forEach(user => {
          const opt = document.createElement("option");
          opt.value = `user:${user.id}`;
          opt.textContent = user.username;
          select.appendChild(opt);
        });

        adminUsersLoaded = true;

      } catch (err) {
        console.warn("Error cargando usuarios:", err);
      }
    }

    function buildHistoryUrl() {
      const select = document.getElementById("historyScopeSelect");

      if (!currentUser || !currentUser.is_staff || !select) {
        return "/api/predictions/history";
      }

      const value = select.value;

      if (value === "all") {
        return "/api/predictions/history?scope=all";
      }

      if (value.startsWith("user:")) {
        const userId = value.replace("user:", "");
        return `/api/predictions/history?user_id=${encodeURIComponent(userId)}`;
      }

      return "/api/predictions/history?scope=mine";
    }

    function formatInputData(inputData) {
      const entries = Object.entries(inputData || {});
      if (!entries.length) return "<p>Sin datos de entrada.</p>";

      let html = "<ul>";

      for (const [key, value] of entries) {
        html += `<li><strong>${key}</strong>: ${value}</li>`;
      }

      html += "</ul>";
      return html;
    }

    function formatResultData(resultData) {
      if (!Array.isArray(resultData) || !resultData.length) {
        return "<p>Sin resultados.</p>";
      }

      let html = "<ol>";

      for (const item of resultData) {
        if (Array.isArray(item) && item.length >= 2) {
          html += `<li>${item[0]} - ${item[1]}%</li>`;
        } else if (typeof item === "object" && item !== null) {
          html += `<li>${item.species || "Especie desconocida"} - ${item.probability || "?"}%</li>`;
        }
      }

      html += "</ol>";
      return html;
    }

    function getSearchableText(log) {
      const username = (log.user || "").toLowerCase();
      const modelName = (log.model_name || "").toLowerCase();

      const inputText = Object.entries(log.input_data || {})
        .map(([key, value]) => `${key} ${value}`)
        .join(" ")
        .toLowerCase();

      let resultText = "";

      if (Array.isArray(log.result_data)) {
        resultText = log.result_data.map(item => {
          if (Array.isArray(item) && item.length >= 2) {
            return `${item[0]} ${item[1]}`;
          }

          if (typeof item === "object" && item !== null) {
            return `${item.species || ""} ${item.probability || ""}`;
          }

          return "";
        }).join(" ").toLowerCase();
      }

      return `${username} ${modelName} ${inputText} ${resultText}`;
    }

    function applyFilters() {
      const searchValue = (document.getElementById("searchInput").value || "").trim().toLowerCase();
      const dateFromValue = document.getElementById("dateFrom").value;
      const dateToValue = document.getElementById("dateTo").value;
      const sortOrder = document.getElementById("sortOrder").value;

      let filteredLogs = [...allLogs];

      if (searchValue) {
        filteredLogs = filteredLogs.filter(log => {
          return getSearchableText(log).includes(searchValue);
        });
      }

      if (dateFromValue) {
        const dateFrom = new Date(dateFromValue);
        dateFrom.setHours(0, 0, 0, 0);

        filteredLogs = filteredLogs.filter(log => {
          const logDate = new Date(log.created_at);
          return logDate >= dateFrom;
        });
      }

      if (dateToValue) {
        const dateTo = new Date(dateToValue);
        dateTo.setHours(23, 59, 59, 999);

        filteredLogs = filteredLogs.filter(log => {
          const logDate = new Date(log.created_at);
          return logDate <= dateTo;
        });
      }

      filteredLogs.sort((a, b) => {
        const dateA = new Date(a.created_at).getTime();
        const dateB = new Date(b.created_at).getTime();
        return sortOrder === "asc" ? dateA - dateB : dateB - dateA;
      });

      currentFilteredLogs = filteredLogs;

      renderSummary(filteredLogs.length, allLogs.length);
      renderHistory(filteredLogs);
    }

    function renderSummary(filteredCount, totalCount) {
      const summary = document.getElementById("historySummary");

      summary.innerHTML = `
        <p>Mostrando <strong>${filteredCount}</strong> predicción(es) de un total de <strong>${totalCount}</strong>.</p>
      `;
    }

    function renderHistory(logs) {
      const container = document.getElementById("historyContainer");

      if (!logs.length) {
        container.innerHTML = "<p>No hay predicciones que coincidan con los filtros.</p>";
        return;
      }

      let html = "";

      logs.forEach((log, index) => {
        const date = new Date(log.created_at).toLocaleString();

        html += `
          <div class="history-card" data-prediction-row="${log.id}">
            <div class="history-card-header">
              <h2 class="history-card-title">Predicción #${index + 1}</h2>
              <button
                type="button"
                class="delete-prediction-btn"
                data-id="${log.id}"
                title="Borrar predicción"
                aria-label="Borrar predicción"
              >×</button>
            </div>

            <div class="history-meta">
              <div class="history-meta-item"><strong>Fecha:</strong> ${date}</div>
              <div class="history-meta-item"><strong>Usuario:</strong> ${log.user || "—"}</div>
              <div class="history-meta-item"><strong>Modelo:</strong> ${log.model_name || "—"}</div>
            </div>

            <div class="history-sections">
              <div class="history-section">
                <h3>Datos de entrada</h3>
                ${formatInputData(log.input_data)}
              </div>

              <div class="history-section">
                <h3>Resultados</h3>
                ${formatResultData(log.result_data)}
              </div>
            </div>
          </div>
        `;
      });

      container.innerHTML = html;
    }

    function getResultSpecies(resultData, index) {
      if (!Array.isArray(resultData)) return "";

      const item = resultData[index];
      if (!item) return "";

      if (Array.isArray(item) && item.length >= 2) {
        return item[0] ?? "";
      }

      if (typeof item === "object" && item !== null) {
        return item.species ?? "";
      }

      return "";
    }

    function getResultProbability(resultData, index) {
      if (!Array.isArray(resultData)) return "";

      const item = resultData[index];
      if (!item) return "";

      if (Array.isArray(item) && item.length >= 2) {
        return item[1] ?? "";
      }

      if (typeof item === "object" && item !== null) {
        return item.probability ?? "";
      }

      return "";
    }

    function exportFilteredHistoryToXlsx() {
      if (!currentFilteredLogs.length) {
        alert("No hay predicciones filtradas para descargar.");
        return;
      }

      if (typeof XLSX === "undefined") {
        alert("No se pudo cargar la librería para generar el Excel.");
        return;
      }

      const rows = currentFilteredLogs.map(log => {
        const input = log.input_data || {};
        const resultData = Array.isArray(log.result_data) ? log.result_data : [];

        return {
          "Fecha": log.created_at ? new Date(log.created_at).toLocaleString() : "",
          "Usuario": log.user || "",
          "Modelo": log.model_name || "",

          "coxalL": input.coxalL ?? "",
          "coxalA": input.coxalA ?? "",
          "esternon": input.esternon ?? "",
          "femur": input.femur ?? "",
          "tibiotarso": input.tibiotarso ?? "",
          "tarsometatarso": input.tarsometatarso ?? "",
          "craneoA": input.craneoA ?? "",
          "craneoL": input.craneoL ?? "",
          "humero": input.humero ?? "",
          "cubito": input.cubito ?? "",
          "radio": input.radio ?? "",

          "Resultado 1": getResultSpecies(resultData, 0),
          "Probabilidad 1 (%)": getResultProbability(resultData, 0),

          "Resultado 2": getResultSpecies(resultData, 1),
          "Probabilidad 2 (%)": getResultProbability(resultData, 1),

          "Resultado 3": getResultSpecies(resultData, 2),
          "Probabilidad 3 (%)": getResultProbability(resultData, 2)
        };
      });

      const worksheet = XLSX.utils.json_to_sheet(rows);
      const workbook = XLSX.utils.book_new();

      XLSX.utils.book_append_sheet(workbook, worksheet, "Historial");

      const today = new Date().toISOString().slice(0, 10);
      const filename = `historial_predicciones_${today}.xlsx`;

      XLSX.writeFile(workbook, filename);
    }

    function wireFilters() {
      document.getElementById("searchInput").addEventListener("input", applyFilters);
      document.getElementById("dateFrom").addEventListener("change", applyFilters);
      document.getElementById("dateTo").addEventListener("change", applyFilters);
      document.getElementById("sortOrder").addEventListener("change", applyFilters);

      document.getElementById("downloadXlsx").addEventListener("click", exportFilteredHistoryToXlsx);

      const historyScopeSelect = document.getElementById("historyScopeSelect");

      if (historyScopeSelect) {
        historyScopeSelect.addEventListener("change", loadHistory);
      }

      document.getElementById("clearFilters").addEventListener("click", () => {
        document.getElementById("searchInput").value = "";
        document.getElementById("dateFrom").value = "";
        document.getElementById("dateTo").value = "";
        document.getElementById("sortOrder").value = "desc";
        applyFilters();
      });
    }

    async function loadHistory() {
      const authenticated = await checkAuthOrRedirect();
      if (!authenticated) return;

      await setupAdminHistorySelector();

      const container = document.getElementById("historyContainer");

      try {
        container.innerHTML = "<p>Cargando historial...</p>";

        const res = await fetch(buildHistoryUrl(), {
          method: "GET",
          credentials: "include",
          cache: "no-store",
          headers: {
            "Accept": "application/json"
          }
        });

        if (!res.ok) {
          container.innerHTML = "<p>Error al cargar el historial.</p>";
          return;
        }

        const data = await res.json();

        if (!data.ok) {
          container.innerHTML = "<p>Error al cargar el historial.</p>";
          return;
        }

        allLogs = data.items || [];
        applyFilters();

      } catch (err) {
        container.innerHTML = "<p>Error de conexión al cargar el historial.</p>";
      }
    }

    function wireDeleteButtons() {
      document.addEventListener("click", (event) => {
        const btn = event.target.closest(".delete-prediction-btn");
        if (!btn) return;

        const predictionId = parseInt(btn.dataset.id, 10);
        if (!predictionId) return;

        deletePrediction(predictionId);
      });
    }

    wireFilters();
    wireDeleteButtons();
    loadHistory();
  </script>
</body>
</html>
